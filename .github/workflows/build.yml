name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 升级 checkout 到 v4 的最新兼容版（实际上 v4 已支持 Node 24，但建议用 v5）
      - name: Checkout code
        uses: actions/checkout@v5  # 或 v4，但 v5 已明确支持 Node 24

      # 2. 升级 setup-java 到 v5（支持 Node 24）
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 移除旧的 setup-android，改用更简洁的方式
      # 安卓 SDK 可通过命令行直接安装，无需额外 action
      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk
          export ANDROID_HOME=/usr/lib/android-sdk
          export PATH=$PATH:$ANDROID_HOME/tools/bin
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-30" "build-tools;30.0.3"

      # 4. 配置 Gradle 内存（防止 OOM）
      - name: Configure Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m" >> gradle.properties

      # 5. 构建 APK
      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info

      # 6. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
